<mat-expansion-panel>
    <mat-expansion-panel-header>
        @if (!selected || !nodeLabels || selected.length === 0) {
            {{placeholder}}
        } @else {
            <mima-filter-tags [labels]="nodeLabels" [selected]="selected"></mima-filter-tags>
        }
    </mat-expansion-panel-header>
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="dialect-tree">
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle>
            <mat-checkbox [checked]="node.selected"
                (change)="selectNode(node, $event.checked)">
                {{node.data.label}}
            </mat-checkbox>
        </mat-tree-node>
        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
            <div class="mat-tree-node">
                <button mat-icon-button matTreeNodeToggle
                        [attr.aria-label]="'Toggle ' + node.name">
                    <mat-icon class="mat-icon-rtl-mirror">
                        {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                    </mat-icon>
                </button>
                <mat-checkbox [checked]="node.selected"
                    (change)="selectNode(node, $event.checked)"
                    [indeterminate]="node.indeterminate">
                    {{node.data.label}}
                </mat-checkbox>
            </div>
            <div [class.dialect-tree-invisible]="!treeControl.isExpanded(node)"
                role="group">
                <ng-container matTreeNodeOutlet></ng-container>
            </div>
        </mat-nested-tree-node>
    </mat-tree>
</mat-expansion-panel>
