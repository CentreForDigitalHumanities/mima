<div class="field is-grouped is-flex-direction-row" *ngIf="filter">
    <div class="field has-addons">
        <div class="control has-icons-left">
            <div class="select">
                <select [(ngModel)]="selectedType" (change)="emit()">
                    <option *ngFor="let filterType of filterTypes" [ngValue]="filterType">{{filterType.name}}</option>
                </select>
            </div>
            <span class="icon is-left">
                <fa-icon [icon]="selectedType.icon"></fa-icon>
            </span>
        </div>
        @if (selectedType.manual) {
        <p class="control">
            <mima-manual-button [id]="selectedType.manual" [showLabel]="false" tooltip="Show manual for this filter"
                i18n-tooltip></mima-manual-button>
        </p>
        }
    </div>
    @switch (selectedType.mode) {
    @case ("dropdown") {
        <div class="control is-expanded">
            <mat-form-field style="width: 100%;">
                <mat-label i18n>{{selectedType.placeholder}}</mat-label>
                <mat-select multiple [(value)]="filter.content" (valueChange)="emit()">
                    <mat-select-trigger>
                        <span *ngIf="!filter.content || filter.content.length === 0; else tags">{{selectedType.placeholder}}</span>
                        <ng-template #tags>
                            <mima-filter-tags [labels]="dropdownLabels" [selected]="filter.content"></mima-filter-tags>
                        </ng-template>
                    </mat-select-trigger>
                    @for (option of (dropdownOptions$ | async); track option.value) {
                        <mat-option [value]="option.value">{{option.label}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
    }
    @case ("dialect") {
    <div class="control is-expanded">
        <mima-dialect-selection [objectName]="objectName" [placeholder]="selectedType.placeholder"
            [content]="filter.content" (contentChange)="emit($event)"></mima-dialect-selection>
    </div>
    }
    @default {
    <p class="control is-expanded" [ngClass]="{'has-icons-right': filter.content}">
        <input #textField class="input" type="text" name="text" [(ngModel)]="textFieldContent" (keyup)="keyup$.next(1)"
            [placeholder]="selectedType.placeholder">
        <span class="icon is-right is-clickable" (click)="clearFilter()" *ngIf="textFieldContent">
            <fa-icon [icon]="faTimesCircle"></fa-icon>
        </span>
    </p>
    }
    }
    @if (clearable) {
    <p class="control">
        <button class="button" i18n-title title="Delete filter" (click)="remove.emit()">
            <span class="icon is-small">
                <fa-icon [icon]="faTrash"></fa-icon>
            </span>
        </button>
    </p>
    }
</div>
